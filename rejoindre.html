<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulaire de contact – Relentless Strength Systems</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/data/pics/logo.png">
<link rel="stylesheet" href="/data/contact-form.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --dark: #111111;
    --dark2: #1a1a1a;
    --accent: #c8102e;
    --accent2: #e8192e;
    --white: #f5f5f0;
    --muted: #888880;
    --border: rgba(255,255,255,0.08);
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Barlow', sans-serif;
    --font-cond: 'Barlow Condensed', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--black);
    color: var(--white);
    font-size: 16px;
    line-height: 1.6;
  }

  main { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.2rem 3rem; }

  .logo { display: block; width: 72px; height: auto; margin: 0 auto 1.2rem; filter: brightness(0) invert(1); }

  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2.2rem, 8vw, 3.2rem);
    line-height: 1;
    letter-spacing: 0.03em;
    text-align: center;
    margin-bottom: 0.6rem;
  }

  .intro { color: var(--muted); text-align: center; font-size: 0.95rem; margin-bottom: 2rem; }
  /* ═══════════ STYLE « Plateau de compétition » (adopté le 08/10/2026 — même thème que l'accueil) ═══════════ */
  :root {
    --black: #0d0f12; --dark: #111419; --dark2: #161a20; --dark3: #20252d;
    --accent: #e0212f; --accent2: #f03a47; --white: #f2f1ed; --muted: #8b919b;
    --border: #262b33;
    --font-display: 'Archivo', sans-serif;
    --font-body: 'Archivo', sans-serif;
    --font-cond: 'JetBrains Mono', monospace;
  }
  body { font-family: var(--font-body); background: var(--black); }
  h1 { font-weight: 900 !important; text-transform: uppercase; letter-spacing: -0.025em !important; line-height: 0.95 !important; }
  nav { background: rgba(13,15,18,0.94); border-bottom-color: var(--border); }
  .nav-links a, .nav-brand-tagline { font-family: var(--font-cond); font-size: 0.78rem; letter-spacing: 0.06em; }
  .nav-links a.nav-relentless { font-weight: 700; }
  .nav-links a.nav-shop, .nav-shop-mobile { border-radius: 0; border-width: 1px; }
  .nav-cta, .nav-contact-mobile { border-radius: 0 !important; font-family: var(--font-cond) !important; }
  .section-tag { font-family: var(--font-cond); font-weight: 500; letter-spacing: 0.14em; font-size: 0.78rem; }
  .section-tag::before { content: '//'; width: auto; height: auto; background: none; }
  body .btn-primary, body .btn-secondary { font-family: var(--font-body); font-weight: 800; letter-spacing: 0.06em; border-radius: 0; }
  .footer-links a { font-family: var(--font-cond); }
  /* Boutique */
  body .shop-group-title, body .order-modal-box h3 { font-weight: 900; letter-spacing: -0.01em; text-transform: uppercase; }
  body .product-placeholder b, body .om-price, body .product-price { font-weight: 800; letter-spacing: -0.01em; }
  body .product-placeholder b { font-size: 1.7rem; }
  body .product-card { border-radius: 0; }
  body .product-card.is-featured { border-color: var(--accent); }
  body .product-badge, body .order-modal-box, body .order-modal-box input, body .order-modal-box select, body .order-modal-box textarea { border-radius: 0; }
  /* Formulaire de contact */
  body .form-card, body .form-card input, body .form-card textarea, body .choice span { border-radius: 0; }
</style>
</head>
<body>
<main>
  <a href="/" aria-label="Retour au site Relentless"><img class="logo" src="/data/pics/logo.png" alt="Relentless Strength Systems"></a>
  <h1>FORMULAIRE DE CONTACT</h1>
  <p class="intro">Remplis ce questionnaire, nous revenons vers toi sur Instagram ou WhatsApp.</p>
  <div id="contact-form"></div>
</main>
<script src="/data/contact-form.js"></script>
</body>
</html>
